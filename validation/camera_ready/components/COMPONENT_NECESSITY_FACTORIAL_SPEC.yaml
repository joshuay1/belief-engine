design:
  core: full_2x2x2_S_by_R_by_P_at_D1
  dedup_extension: paired_D1_vs_D0_at_S1_R1_P1
  evidence_scoring_extension: paired_E1_vs_E0_at_S1_R1_P1_D1
  reason_dedup_not_fully_crossed: >-
    The core and targeted arms estimate every S/R/P main effect and
    interaction and the deduplication effect at the released full setting.
    No cross-factor deduplication interaction will be claimed.
  reason_evidence_scoring_not_fully_crossed: >-
    The scale-matched uniform-fixed arm is a targeted full-setting control for
    graded evidence scores. No scoring interaction will be claimed.
