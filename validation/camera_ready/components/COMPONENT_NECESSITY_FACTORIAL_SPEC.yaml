outcomes:
  primary:
    name: absolute_final_pro_con_gap
    source: same_frozen_external_evaluator_for_every_condition
    lower_is_smaller_expressed_disagreement: true
  secondary:
    - normalized_trajectory_gap_auc
    - mean_absolute_stance_shift
    - absolute_final_midpoint_shift
    - same_side_final_rate
    - final_side_switch_count
    - any_time_side_switch_count
  outcome_independent_manipulation_checks:
    evidence_scoring:
      paired_conditions:
        graded: be_s1_r1_p1_d1
        uniform: be_s1_r1_p1_d1_uniform
      report:
        - realized_dynamic_score_count_mean_SD_and_quantiles
        - mean_absolute_deviation_from_uniform_0.8475946340113878
        - retained_classifier_score_distribution_in_both_arms
        - paired_score_and_ranking_divergence_for_identity_matched_messages
        - paired_replacement_retrieval_context_and_internal_state_divergence
      continuation_use: prohibited
      interpretation: >-
        E1 uses the realized classifier scores at update time. E0 still records
        the classifier scores but fixes active dynamic-record strength to the
        frozen scale anchor. Message-level score or ranking comparisons are
        identified only when the one-way record-identity sequence matches
        across the pair; the denominator must always be reported.
    structured_decomposition:
      paired_conditions: all_four_R_by_P_core_pairs_at_D1_E1
      report:
        - S1_claims_per_message_distribution
        - S1_fraction_of_messages_with_more_than_one_claim
        - S0_one_verbatim_record_contract
        - final_active_and_archived_record_counts
        - paired_rendered_context_retrieval_order_and_internal_state_divergence
      continuation_use: prohibited
      interpretation: >-
        This is structured atomic decomposition versus one verbatim
        whole-message record with the same minimum update metadata. It is not
        memory versus no memory.
    deduplication:
      paired_conditions:
        enabled: be_s1_r1_p1_d1
        disabled: be_s1_r1_p1_d0
      report:
        - dynamic_added_ignored_replaced_counts
        - fraction_of_50_pairs_with_any_D1_ignore_or_replace
        - final_dynamic_active_and_archived_record_counts
        - paired_difference_in_retrieval_record_count
        - exact_rendered_retrieval_context_sequence_SHA256_divergence
      continuation_use: prohibited
      interpretation: >-
        These quantities establish realized exposure to the deduplication
        intervention. They do not measure duplicate-detection accuracy. If D1
        rarely fires, a null stance contrast is a weak-exposure result rather
        than evidence that deduplication is unnecessary.

primary_contrast_family:
  positive_direction: named_component_reduces_external_final_gap
  contrasts:
    structured_representation_main:
      formula: mean_RP[g(S0,R,P,D1)-g(S1,R,P,D1)]
    response_retrieval_main:
      formula: mean_SP[g(S,R0,P,D1)-g(S,R1,P,D1)]
    persistence_main:
      formula: mean_SR[g(S,R,P0,D1)-g(S,R,P1,D1)]
    deduplication_at_full_setting:
      formula: g(S1,R1,P1,D0)-g(S1,R1,P1,D1)
    graded_evidence_scoring_at_full_setting:
      formula: g(S1,R1,P1,D1,E0)-g(S1,R1,P1,D1,E1)
  uncertainty:
    bootstrap: hierarchical_topics_then_paired_trial_seeds
    repetitions: 100000
    random_seed: 20260725
    marginal_interval: percentile_95
    familywise_interval: bonferroni_percentile_99
    familywise_quantiles: [0.005, 0.995]
  offline_exact_topic_vector_sensitivity:
    status: secondary_sensitivity_registered_bootstrap_remains_primary
    unit: ten_topic_level_vectors_after_averaging_five_trials
    enumeration: all_1024_shared_sign_vectors
    statistic: absolute_sum_divided_by_root_sum_squares
    family_adjustment: maximum_over_all_five_primary_contrasts
    assumptions:
      - topic vectors are independent units
      - each joint five-contrast topic vector is sign-symmetric under the null
      - the same sign applies to all five coordinates within a topic
    qualification: >-
      This is an exact enumeration under its sign-symmetry assumptions, not a
      randomized-trial test. It supplements but cannot replace the registered
      hierarchical bootstrap and family-wise intervals.
  decision_rule: >-
    Lead with the familywise interval. A component is supported as reducing
    disagreement only if its 99% interval is strictly positive. Null,
    negative, and heterogeneous estimates remain reportable outcomes.

secondary_contrasts:
  structured_update_path_without_response_retrieval:
    formula: mean_P[g(S0,R0,P,D1)-g(S1,R0,P,D1)]
    interpretation: >-
      With retrieval disabled, this isolates the causal pathway from
      representation through storage/update and scalar stance guidance.
  structured_effect_with_response_retrieval:
    formula: mean_P[g(S0,R1,P,D1)-g(S1,R1,P,D1)]
  representation_by_retrieval:
    formula: C_S_given_R1-C_S_given_R0
    interpretation: >-
      Difference-in-differences identifying the incremental pathway from
      structured records being exposed in the response prompt.
  representation_by_persistence: standard_factorial_interaction
  retrieval_by_persistence: standard_factorial_interaction
  representation_by_retrieval_by_persistence: standard_factorial_interaction
  reporting: exploratory_95_percent_intervals_without_significance_claims

