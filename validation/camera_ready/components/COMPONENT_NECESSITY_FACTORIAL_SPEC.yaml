    max_attempts: 2
    max_tokens: 2000
    strength_source: same_local_classifier
    uniform_control: active_support_strength_fixed_at_0.8475946340113878
  response_evidence_budget:
    tokens: 128
    tokenizer: cl100k_base
    requirement: >-
      Every retrieval-on response must expose exactly 128 tokens under the
      pinned tokenizer. The verifier fails closed if any retrieval-on prompt
      does not saturate the budget. Retrieval-off prompts expose zero memory
      records by design.

