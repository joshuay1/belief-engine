    - We should adopt an austerity regime
    - We should legalize sex selection
    - We should adopt atheism
    - We should subsidize journalism
    - We should adopt libertarianism
  trial_indices: [1, 2, 3, 4, 5]
  conditions: 10
  debates: 500
  experimental_unit: topic_by_paired_trial_seed
  paired_units: 50
  execution_order: trial_then_registered_topic_order_complete_blocks
  within_block_submission_order: cyclic_rotation_of_registered_condition_order
  position_rotation_formula: >-
    zero_based_rotation_offset =
    (registered_topic_index + zero_based_trial_index) mod 10
  submission_position_balance: exactly_5_per_condition_per_position_over_50_blocks
  within_topic_position_diversity: >-
    every condition occupies five distinct submission positions across the
    five trials of each topic
  block_barrier: all_10_results_markers_required_before_next_block_submission
  speaker_order: pro-first
  rounds_per_debate: 15
  initial_stances: {Pro: 0.75, Con: -0.75}
  complete_case_rule: >-
    Every primary contrast requires all ten conditions for a topic-trial
    block. Do not impute or substitute cells.

common_controls:
