transparency:
  motivation: >-
    Reviewers requested targeted ablations separating structured memory,
    deduplication, response retrieval, and the update/persistence path.
  prior_information: >-
    Results from the historical matched baseline, deterministic duplicate
    fixture, DEBATE replay, and historical full-loop chain were known. No
    response, extraction, judge output, or outcome from any cell in this new
    contemporaneous factorial was generated before this specification.
  prelaunch_validation_amendment: >-
    After registration and still before any new scientific outcome, a
    synthetic 135-cell analyzer test and an independent runner-free preflight
    verifier were added. They did not change cells, outcomes, contrasts,
    multiplicity, continuation rules, or call budgets.
  outcome_blind_power_amendment: >-
    Still before any response, extraction, judge output, or scientific outcome
    from this campaign, an outcome-blind power audit showed that the original
    five-topic by three-trial design was only a large-effect screen. The design
    was therefore amended once, before launch, to all ten already-fixed
    benchmark topics and five trials per topic. At the same pre-outcome point,
    the reviewer wording was audited and a polarity-preserving uniform-strength
    arm was added to isolate graded evidence scoring at the full setting. The
    original registration, hashes, and 135-config dry run remain preserved in
    the amendment record.
  outcome_blind_deduplication_telemetry_amendment: >-
    Still before any paid component-factorial call or scientific outcome, a
    skeptical-review audit found that a null D1-versus-D0 outcome would be
    uninterpretable unless the report established whether the natural D1 gate
    actually ignored or replaced dynamic evidence. Outcome-independent
    telemetry and independently reconstructed manipulation tables were added
    without changing a cell, endpoint, contrast, multiplicity rule,
    continuation rule, or call budget. The telemetry reports dynamic
    added/ignored/replaced counts, final active/archive counts, and SHA-256
    fingerprints of exact rendered retrieval contexts. Its values never
    control campaign continuation.
  outcome_blind_execution_resume_safety_amendment: >-
    Still before any paid component-factorial call or scientific outcome, an
    execution audit found that retrying an interrupted canary would refuse the
    registered output root, while interrupted pilot, mid, and full stages could
    not pass their exact-completed-set prerequisite checks. The launcher now
    supports a dedicated resume-canary mode and whole-cell resume for every
    later stage. Before the locked runner may skip a results.json marker, the
    checkpoint verifier applies the frozen config and functional-result
    contracts, records a SHA-256 ledger of every file in every completed raw
    cell, and requires byte-identical post-resume preservation. Marker-free
    interrupted cells remain eligible only for complete-debate rerun. This
    changes no cell, factor, endpoint, multiplicity rule, continuation rule,
    or call budget.
  outcome_blind_component_manipulation_telemetry_amendment: >-
    Still before any paid component-factorial call or scientific outcome, a
    second skeptical-review audit found that the report also had to establish
    realized exposure to the E and S interventions. Numeric-only extraction
    score events, one-way record fingerprints, retrieval identity/order
    fingerprints, canonical dynamic-state fingerprints, and paired report-only
    tables were therefore added. The same pre-outcome amendment adds an exact
    shared-topic-vector sign-flip/max-family sensitivity for the five primary
    final-gap contrasts. It changes no cell, outcome, registered bootstrap,
    contrast, multiplicity decision rule, continuation rule, or call budget.
    Telemetry values cannot stop, extend, select, or otherwise adapt the
    campaign.
  outcome_blind_block_execution_amendment: >-
    Still before any paid component-factorial call or scientific outcome, an
    execution-order audit found that the generic parallel runner could submit
    conditions from later topic-trial units before every condition in the
    current paired unit had completed, and that a fixed within-block order
    could confound condition with submission position. The execution layer was
    therefore frozen to 50 complete ten-cell blocks ordered by trial and then
    the already-registered topic order. Within blocks, the ten registered
    conditions are cyclically rotated, giving every condition exactly five
    appearances in each of the ten submission positions. A hard barrier
    requires all ten completion markers before the next block can begin. The
    canary was correspondingly expanded from three cells to the complete first
    ten-cell block (1,080 successful calls). This changes no registered cell,
    outcome, contrast, multiplicity rule, full-campaign continuation rule, or
    54,000-call budget.
  outcome_blind_interruption_reconciliation_amendment: >-
    Still before any paid component-factorial call or scientific outcome, an
    independent execution audit identified two narrow interruption states:
    a terminated scheduler could leave invocation or attempt status running,
    and a worker could atomically finish results.json before the parent
    process recorded its raw-file ledger. Resume now requires the frozen
    functional checkpoint first, then an outcome-blind reconciliation that
    matches its whole-cell SHA-256 ledgers, validates the separate execution
    sidecar, closes stale running records as interrupted, and reconstructs
    missing parent provenance. It hashes but never parses results.json,
    modifies no completed raw-cell byte, and leaves marker-free cells eligible
    only for whole-cell quarantine and rerun. This changes no cell, factor,
    endpoint, contrast, multiplicity rule, continuation rule, or call budget.
  post_failure_schema_contract_amendment: >-
    The first provider-backed implementation canary produced nine valid
    completion markers and one marker-free failure after structured
    distillation returned thirteen arguments twice. The prompt and local
    validator already imposed a twelve-item maximum, but the strict JSON schema
    omitted maxItems. Before any component-factorial effect estimate was
    computed or used, the provider schema was repaired to encode maxItems 12.
    The aborted nine-cell predecessor is preserved and excluded. The repaired
    campaign starts in a fresh output root and reruns every registered cell,
    including the complete ten-cell canary. No scientific factor, condition,
    topic, seed, endpoint, contrast, multiplicity rule, continuation rule, or
    call budget changed.
  post_failure_worker_import_path_amendment: >-
    The first launch from the schema-repaired source failed all ten canary
    workers before provider execution because spawned processes could not
    import the registered runner package. An external PYTHONPATH retry
    established the cause but was deliberately interrupted before any
    completion marker; partial initialization files were preserved and wholly
    excluded. The scheduler now inserts its file-derived repository root into
    sys.path before spawning workers, and a sanitized subprocess regression
    test enforces that contract. The permanent campaign starts in a fresh
    successor root and reruns all 500 cells. This changes no scientific setting
    or inference.
  post_failure_flat_completion_audit_amendment: >-
    The next full canary completed all ten conditions and passed the independent
    schedule audit, but the scientific verifier rejected all four flat
    whole-message cells. Their exact counters showed 30 of 30 extraction calls,
    30 classification passes, zero failures, and 30 single records; only the
    generic runner's redundant complete field was absent because post-run
    enrichment was gated to structured mode. Without inspecting scientific
    outcomes, the same strict completion enrichment was extended to both
    registered record modes. The completed canary is preserved and excluded,
    and the final campaign begins in a fresh successor root. No provider
    request, scientific setting, or inference changed.
  scope: >-
    The representation factor compares atomic claim decomposition against one
    verbatim whole-message record. Both conditions retain the minimum polarity
    and strength metadata required by the same Belief Engine update equation.
    It therefore tests the value of structured decomposition, not an
    impossible metadata-free invocation of the numerical updater.

