    model: gpt-5.4-mini
    reasoning_effort: none
    verbosity: low
    temperature: 0.0
    strict: true
    stance_source: external_only
  response:
    shell: matched_v1
    context_messages: 4
    word_limit: 120
    retrieval_strategy: proportional
    retrieval_k: 10
  memory:
    belief_semantics_mode: active_explicit_prior_v1
    update_sensitivity: 0.2
    anchor_sensitivity: 0.4
    allow_self_arguments: false
    confirmation_bias: 0.0
    argument_similarity_threshold: 0.6
    self_similarity_threshold: 0.45
    cross_polarity_dedup: false
  extraction:
