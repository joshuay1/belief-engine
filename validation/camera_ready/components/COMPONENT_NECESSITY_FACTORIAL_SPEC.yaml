staging:
  dry_run: all_500_configs_before_any_paid_call
  canary: complete_first_ten_condition_topic_by_trial_block
  pilot: all_100_trial_1_cells
  extension: >-
    Trials 2 and 3, then trials 4 and 5, are unconditional registered
    extensions after functional verification of the preceding stage. Outcomes
    do not control continuation.
  manipulation_telemetry_rule: >-
    Realized scoring, structured-decomposition, deduplication,
    retrieval-context, and canonical-state diagnostics are report-only. Zero,
    sparse, or extensive exposure cannot stop, extend, select, or otherwise
    adapt the registered campaign. Functional schema validity may fail a cell;
    the scientific values of valid telemetry may not.
  stop_only_for:
    - functional_contract_failure
    - credential_or_provider_failure
    - disk_safety_failure
    - explicit_operator_stop
  resume_contract: >-
    Canary retry uses resume-canary. Pilot, mid, and full may be invoked again
    after interruption. Before each invocation, every existing completion
    marker in the target stage must pass the frozen functional verifier, the
    prior registered stage must be complete, and every completed raw cell is
    whole-directory SHA-256 ledgered. An outcome-blind reconciliation then
    validates the separate execution sidecar, closes stale running
    invocation and attempt records, and reconstructs parent provenance for a
    valid marker written before its parent ledger. It hashes but never parses
    results.json and never modifies a completed raw cell. The block scheduler
    never submits a completed cell and invokes the locked runner in resume
    mode only for marker-free cells; the runner quarantines any marker-free
    partial directory before rerunning the whole debate. The postflight
    requires all preexisting completed cells to remain byte-identical and the
    target stage to be complete.
  execution_schedule_contract:
    blocks: 50
    cells_per_block: 10
    canary_blocks: 1
    pilot_blocks: 10
    mid_blocks: 30
    full_blocks: 50
    position_rotation: >-
      cyclic_offset_equal_to_(registered_topic_index_plus_zero_based_trial_index)_modulo_10
    appearances_per_condition_per_position: 5
    distinct_positions_per_condition_within_each_topic: 5
    advance_rule: all_10_cells_complete
    independent_non_importing_verification: required
    outcome_free_cell_sidecar: execution_schedule.json
    result_files_hashed_without_parsing: true
    stale_execution_reconciliation_requires_functional_checkpoint: true
    recovered_completed_raw_cells_modified: false
    outcome_values_used_for_scheduling: false
    system_fingerprint_recorded: false
  resume_safety_tests:
    synthetic_positive_and_adversarial_checkpoint_test: PASS
    pilot_prerequisite_from_complete_canary: PASS
    completed_cell_byte_mutation_rejected: true
    malformed_completion_marker_rejected: true
    missing_prerequisite_rejected: true
    unregistered_raw_directory_rejected: true
    marker_free_interruption_classified_for_whole_cell_rerun: true
    sigterm_after_marker_canary_reconciled: true
    sigterm_after_completed_canary_later_stage_reconciled: true
    interrupted_completed_cell_not_resubmitted: true
    interrupted_completed_cell_byte_preservation: true
    checkpoint_byte_tamper_rejected: true
    coherent_sidecar_position_tamper_rejected: true

claim_boundaries:
  - >-
    S1 versus S0 tests claim decomposition relative to a verbatim
    whole-message memory that retains minimal update metadata; it is not a
    comparison against an agent with no state.
  - >-
    D is estimated only at S1,R1,P1. No deduplication interaction is identified.
    The realized-exposure table must accompany this contrast. Sparse natural
    triggering limits the interpretation of a null effect but does not alter
    the registered all-cell estimand.
  - >-
    E is estimated only at S1,R1,P1,D1. It tests graded classifier scores
    relative to a polarity-preserving scale-matched uniform control; no scoring
    interaction is identified.
  - >-
    The E intervention does not directly alter an extracted record's claim
    text or polarity, but active score also enters score-based replacement and
    retrieval ordering. Downstream generated dialogue may consequently
    diverge. The contrast therefore tests the whole evidence-scoring pathway,
    not only the numerical updater. It intervenes only on newly extracted
    dynamic records; frozen seed-record strengths are unchanged.
    The fixed value matches the frozen classifier's mean on an
    outcome-independent AQR benchmark, but the prospective debate-message mean
    may differ; update magnitude is therefore benchmark-scale matched, not
    guaranteed to be message-scale matched. This is a scoring-off comparison,
    not a pure calibration contrast.
  - >-
    P is persistence of dynamic evidence, not a no-update/update-rule
    ablation. The separately locked u=0 uptake campaign supplies the no-update
    contrast; no update-rule claim will be attributed to P alone.
  - >-
    Ten fixed topics improve topic resolution but do not license claims beyond
    the sampled benchmark topic family.
  - >-
    Smaller external disagreement is not automatically better consensus,
    factual accuracy, or human-likeness.

analysis_outputs:
  required_manipulation_files:
    - deduplication_manipulation_checks.csv
    - deduplication_manipulation_summary.json
    - evidence_scoring_manipulation_checks.csv
    - evidence_scoring_manipulation_summary.json
    - structured_decomposition_manipulation_checks.csv
    - structured_decomposition_manipulation_summary.json
    - primary_topic_vector_signflip_max_family.csv
    - primary_topic_vector_signflip_metadata.json
  independent_verification: >-
    The standalone post-outcome verifier reconstructs all manipulation tables,
    summaries, and the exact 1,024-pattern topic-vector calculation from all
    500 raw results without importing the campaign runner or primary analyzer.
    Its self-test includes known-exposure, zero-exposure, and output-tamper
    fixtures; zero exposure must be reported rather than treated as a failed
    campaign.
