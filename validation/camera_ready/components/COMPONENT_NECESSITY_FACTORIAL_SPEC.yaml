factors:
  representation:
    structured:
      code: S1
      extraction_mode: structured_json_v1
      definition: >-
        Two-stage extraction decomposes each message into distinct canonical
        claims and classifies every claim.
    flat_verbatim:
      code: S0
      extraction_mode: whole_message_json_v1
      definition: >-
        No claim distillation or decomposition. The complete generated message
        is stored verbatim as exactly one record and receives one
        proposition-relative classification.
  response_retrieval:
    on: {code: R1, response_retrieval_enabled: true}
    off: {code: R0, response_retrieval_enabled: false}
  persistence:
