analysis_id: neurips_2026_matched_baseline_primary_multiplicity_posthoc_v1
status: locked_for_execution
classification: transparent_posthoc_multiplicity_audit_of_registered_primary_family
locked_at: "2026-07-25"

question: >-
  Do the two registered Belief Engine versus comparator contrasts in absolute
  externally scored final Pro-Con gap remain resolved when they are treated as
  one two-comparison family and their dependence is preserved?

relationship_to_registration:
  parent: MATCHED_BASELINE_PREREGISTRATION.yaml
  parent_primary_outcome: absolute_final_pro_con_gap
  parent_experimental_unit: topic_by_paired_seed
  classification: >-
    The endpoint and both paired comparisons were specified in the parent
    registration. The familywise interval and exact topic-sign-flip analyses
    are transparent post-hoc multiplicity robustness checks; they do not
    replace the originally reported estimates or uncertainty intervals.

transparency:
  results_known_before_this_lock:
    - primary paired estimates and previously reported unadjusted intervals
    - topic-level primary estimates
  results_not_used_to_define_family:
    - simultaneous max-absolute-t intervals
    - Bonferroni percentile intervals
    - exact shared topic-sign-flip p-values
    - leave-one-topic-out ranges
  reporting_rule: >-
    Report both contrasts, every topic sign, and every leave-one-topic-out
    estimate regardless of direction, interval width, or p-value.

primary_family:
  metric: absolute_final_pro_con_gap
  definition: >-
    At round 15, take the absolute difference between the condition-blind
    external evaluator's Pro and Con scores within each debate.
  difference: belief_engine_minus_comparator
  direction: negative_means_smaller_final_gap_for_belief_engine
  family_size: 2
  contrasts:
    - be_gpt54mini_minus_prompt_self_update_gpt54mini
    - be_gpt54mini_minus_rag_self_update_gpt54mini
  excluded_outcomes:
    - all_secondary_and_diagnostic_outcomes_including_trajectory_gap_auc

