reconstruction:
  source: frozen_external_stance_trajectory_csv
  final_round: 15
  required_post_start_stance_source: external_judge
  pairing_key:
    - topic_slug
    - trial
    - seed
  checks:
    - exact_input_hashes_and_byte_sizes
    - verified_completion_inventory_150_of_150
    - clean_execution_commit_and_single_evaluator_fingerprint
    - complete_round_0_through_15_pro_and_con_trajectories
    - identical_topic_trial_seed_registry_across_three_conditions
    - exact_summary_to_trajectory_final_score_agreement
  failure_policy: abort_before_writing_any_result

bootstrap:
  method: shared_hierarchical_topic_then_paired_seed_bootstrap
  estimand: equal_topic_weighted_mean_paired_difference
  resampling:
    - sample_five_topics_with_replacement
    - within_each_sampled_topic_sample_ten_paired_seeds_with_replacement
  shared_resamples_across_contrasts: true
  replicates: 100000
  random_seed: 2026072507
  chunk_size: 2000
  pointwise_interval: percentile_2_5_and_97_5
  simultaneous_method: max_absolute_studentized_bootstrap_deviation
  simultaneous_definition: >-
    Divide each shared bootstrap estimate's deviation from the observed
    contrast by that contrast's bootstrap standard error; use the 95th
    percentile of the maximum absolute standardized deviation across the two
    contrasts as one common critical value.
  familywise_confidence_level: 0.95
  bonferroni_percentile_quantiles:
    - 0.0125
    - 0.9875
  bonferroni_marginal_confidence_level: 0.975

exact_topic_sign_flip:
  method: exhaustive_shared_topic_vector_sign_flip
  input: two_contrast_vector_of_ten_seed_mean_differences_for_each_topic
  topics: 5
  assignments: 32
  assignment_order: integer_masks_0_through_31
  shared_signs_across_contrasts: true
  statistic: >-
    For each contrast, the mean of five topic differences divided by their
    sample standard deviation over sqrt(5), recomputed after every shared sign
    assignment.
  marginal_p_value: >-
    Fraction of all 32 assignments whose absolute contrast-specific t is at
    least the observed absolute t.
  familywise_p_value: >-
    Fraction of all 32 assignments whose maximum absolute t across both
    contrasts is at least the observed absolute contrast-specific t.
  tail: two_sided_greater_than_or_equal
  plus_one_correction: false_complete_enumeration
  zero_variance_rule: zero_if_mean_zero_otherwise_signed_infinity

topic_reporting:
  enumerate_all_topic_mean_differences_and_signs: true
  leave_one_topic_out:
    estimand: equal_weighted_mean_of_four_retained_topic_means
    report_all_omissions: true
    report_minimum_and_maximum_ranges: true

assumptions_and_limits:
  - >-
    The bootstrap treats the five observed topics as a resampling population
    and paired seeds as exchangeable within topic. Five topics provide limited
    support for topic-general claims.
  - >-
    The exact sensitivity requires joint sign exchangeability of each
    two-contrast topic vector under the null. Exhaustive enumeration removes
    Monte Carlo error but not this assumption.
  - >-
    The exact reference distribution has only 32 assignments, so p-values are
    coarse.
  - >-
    This is a post-hoc familywise robustness audit, not a new preregistered
    experiment and not independent replication.

interpretation:
  supported_if_observed: >-
    A contrast whose simultaneous interval excludes zero is resolved at
    familywise 95% confidence within this locked two-comparison primary family.
    Agreement with the Bonferroni percentile sensitivity and exact topic-level
    test strengthens robustness to inferential method, subject to the
    five-topic limitation.
  prohibited:
    - adding_trajectory_auc_or_any_secondary_metric_to_the_primary_family
    - selecting_or_dropping_a_contrast_after_inspecting_results
    - treating_turns_agents_or_conditions_as_independent
    - claiming_topic_general_superiority_from_five_topics
    - calling_this_posthoc_audit_preregistered
    - equating_smaller_disagreement_with_normatively_better_deliberation

outputs:
  directory: results/analyses/matched_baseline_primary_multiplicity_posthoc_v1
  analyzer_payloads:
