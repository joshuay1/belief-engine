research_question: >-
  When generator, dialogue shell, context budget, starting stance, topics,
  paired seeds, and external evaluator are held fixed, does the Belief Engine
  produce a different expressed-stance trajectory from prompt self-update and
  RAG plus self-update?

conditions:
  - be_gpt54mini
  - prompt_self_update_gpt54mini
  - rag_self_update_gpt54mini

topics:
  - Social media brings more harm than good
  - We should subsidize journalism
  - We should introduce compulsory voting
  - We should adopt atheism
  - We should adopt libertarianism

design:
  trials_per_topic_condition: 10
  paired_seeds_per_topic: 10
  total_debates: 150
  execution_schedule: paired
  worker_processes: 3
  rounds_per_debate: 15
  initial_pro_stance: 0.75
  initial_con_stance: -0.75
  generator_model: gpt-5.4-mini
  generator_reasoning_effort: none
  generator_verbosity: low
  generation_temperature: 0.7
  self_update_temperature: 0.0
  response_context_messages: 4
  response_shell: matched_v1
  retrieval_k: 10
  active_only_retrieval: true
  allow_self_arguments: false
  prompt_self_update_static_seed_context: false
  belief_semantics_mode: active_explicit_prior_v1
  explicit_prior_seed_records_numerically_excluded: true
  be_update_sensitivity: 0.2
  be_anchor_sensitivity: 0.4
  stance_source_for_all_conditions: external
  strict_judge_parsing: true
  extraction_output_mode: structured_json_v1
  strict_extraction_parsing: true
  extraction_max_attempts_per_stage: 2
  extraction_max_tokens_per_attempt: 2000
  strict_memory_ingestion: true

evaluator:
  backend: openai
  model: gpt-5.4-mini
  reasoning_effort: none
  verbosity: low
  temperature: 0.0
  condition_blind: true
  prompt_path: src/prompts/evaluator_optimized.txt
  prompt_sha256: 2c6eb444cd6ff752aa9b99929c1998936411379760b5a0340bfbcd4a2523ad83

outcomes:
  primary:
    name: absolute_final_pro_con_gap
    definition: >-
      Absolute difference between externally judged final Pro and Con stance
      within each paired topic-seed-condition debate.
  secondary:
    - gap_reduction_from_initialization
    - mean_absolute_stance_shift
    - crossing_rate
    - trajectory_gap_auc
    - be_internal_external_agreement

analysis:
  experimental_unit: topic_by_paired_seed
  report_every_topic: true
  paired_method_differences: true
  uncertainty:
    primary: hierarchical_bootstrap_topics_then_paired_seeds
    sensitivity: paired_seed_bootstrap_with_topic_fixed_effects
    confidence_level: 0.95
  prohibited:
    - treating turns as independent observations
    - treating the two agents as independent observations
    - selecting topics, trials, or outcomes after inspecting results

decision_rules:
  - condition: external comparison is null or materially heterogeneous
    action: >-
      Withdraw the general comparative-convergence claim and retain the
      controllability, inspectability, and auditability claims.
  - condition: one topic drives the pooled result
    action: >-
      Lead with topic heterogeneity and do not state a topic-general advantage.
  - condition: implementation correction changes the qualitative BE result
    action: >-
      Stop expansion, audit the discrepancy, and disclose it rather than mixing
      corrected and submitted trajectories.
  - condition: any extraction stage still fails after its bounded retry
    action: >-
      Exclude and rerun the entire affected trial; do not retain a trajectory
      with a silently missing evidence turn.
  - condition: retry-rescued turns exceed 0.5 percent overall or 2 percent in
      any topic-condition cell
    action: >-
      Stop the campaign and audit extraction reliability before interpreting
      comparative outcomes.

preflight_blockers:
  resolved:
    - locked fixed-start stance mode to active_explicit_prior_v1
    - matched_v1 response shell is shared by all three conditions
    - retrieval filters inactive records before quota allocation and backfill
    - external stance is selected for every summary and trajectory
    - prompt hashes and resolved context/retrieval settings are recorded
    - live evaluator parsing is strict and fail-closed
    - one complete 15-round three-condition live smoke passed with 90 direct
      external scores, identical seed sets, and exact active-state reconstruction
    - the first launch was stopped before any extractor-backed run completed
      after a hidden 500-token backend cap truncated one legacy JSON response
    - three workers replace six after concurrent Metal/MPS temporary files
      exhausted the nearly full local volume
    - structured_json_v1 sends the requested 2000-token budget through the
      structured-output path, validates both stages, and retries whole stages
    - strict campaign runs fail the trial on an unrecovered extraction error
      or memory-ingestion error and require one audited extraction call per
      generated message
  remaining: []

dry_run:
