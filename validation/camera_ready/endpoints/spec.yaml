analysis:
  id: exact_endpoint_trajectory_v1
  status: frozen_posthoc_mechanism_analysis
  frozen_at_utc: "2026-07-25T00:00:00Z"
  purpose: >-
    Test whether prior anchoring and evidence uptake can yield exactly the same
    final stance while producing materially different intermediate trajectories.
    All eligibility, orientation, root solving, and example selection are blind
    to observed opinion change.

inputs:
  bundle: results/debate_component_ablation_v1
  accepted_stream:
    path: results/debate_component_ablation_v1/accepted_stream.jsonl.gz
    sha256: ecb79b76738c7bf6ada4dbaba8fd1f8dc836cc3c2f11d61c796fee297e6e491e
  predictions:
    path: results/debate_component_ablation_v1/predictions.csv.gz
    sha256: d22de2566db26ee9fcbcf85f68423bbd51163c830b643f633fbe9646168ab943
  manifest:
    path: results/debate_component_ablation_v1/manifest.json
    sha256: 929e3a20747fff56a31da2e0acb31c8895310f3ab85c4231d363d782d5bb7521
  expected:
    participant_records: 2495
    group_clusters: 704
    topic_clusters: 107

policy_replay:
  stance_transform: "L0 = log((1+s0)/(1-s0)); stance(L) = tanh(L/2)"
  update: "Lt = a*L0 + sum_{i<=t} sign_i*log(1+u*strength_i)"
  low_anchor: 0.2
  high_anchor: 1.0
  reference_uptake: 0.05
  root_interval:
    lower: 0.25
    upper: 0.8
  exact_endpoint_tolerance_stance: 1.0e-10
  root_absolute_tolerance: 5.0e-15
  root_relative_tolerance: 1.0e-14
  root_scan_intervals: 8192
  root_rule: >-
    Enumerate sign-changing residual brackets on the fixed scan, solve each
    bracket by Brent bisection, deduplicate numerical roots, and retain the
    smallest root in the closed interval. Exact scan-point roots are retained.

outcome_blind_design:
  eligibility:
    minimum_evidence_items: 3
    require_nonzero_uptake_leverage: true
    uptake_leverage_definition: >-
      E(0.8)-E(0.05), where E(u) is cumulative signed evidence log odds.
    leverage_zero_tolerance: 1.0e-14
    exclude_absolute_common_endpoint_at_or_above: 0.95
  orientation_and_comparison:
    prior_consistent:
      rule: "L0 * (E(0.8)-E(0.05)) > 0"
      reference: "high_anchor, reference_uptake"
      variable: "low_anchor, solved_uptake"
    prior_opposing:
      rule: "L0 * (E(0.8)-E(0.05)) < 0"
      reference: "low_anchor, reference_uptake"
      variable: "high_anchor, solved_uptake"
  prohibited_fields:
    - opinion_change_actual
    - any response stratum derived from opinion_change_actual
  guarantee: >-
    The parser checks the frozen input bundle, but observed opinion change is
    discarded before eligibility. It is never included in an analysis record,
    never used to orient or solve a trajectory, and never used to select an
    example.

estimands:
  denominator: >-
    All participant records with at least three evidence items, nonzero exact
    uptake leverage, and an outcome-blind reference endpoint with absolute
    stance below 0.95. Records with no root remain in this denominator.
  primary:
    name: exact_match_and_maximum_interior_gap_ge_0_20_rate
    definition: >-
      Fraction of the full denominator for which a root is found, endpoint
      error is at most 1e-10, and maximum absolute trajectory gap over
      intermediate evidence steps is at least 0.20.
  secondary:
    - feasible_exact_match_rate
    - conditional_separation_rate_ge_0_20_among_exact_matches
    - median_maximum_interior_gap_among_exact_matches
    - maximum_absolute_endpoint_error_among_exact_matches

uncertainty:
  confidence_level: 0.95
  bootstrap_replicates: 100000
  seed: 2026072502
  primary_scheme: topic_then_group
  sensitivity_schemes:
    - group_only
    - fixed_topics_groups_within_topic
  bootstrap_unit: >-
    Groups are sampled as intact clusters. In the hierarchical scheme, topics
    are sampled with replacement and groups are then sampled with replacement
    within every sampled topic. Groups are verified to be nested in topics.
  interval: percentile
  leave_one_topic_out: true

examples:
  number: 2
  strata:
    - prior_consistent
    - prior_opposing
  eligible_pool: >-
    Exact matches with maximum interior trajectory gap at least 0.20.
  deterministic_selection: >-
    Within each orientation, compute the median maximum interior trajectory
    gap, select the record with the smallest absolute distance to that median,
    and break ties by participant_record_id.

reporting:
  persist_participant_denominator: true
  persist_exact_matches: true
  persist_long_form_example_trajectories: true
  report_all_exclusions_and_solver_failures: true
  interpretation_limit: >-
    This is a fixed-stream policy-identification test. It proves that the two
    controls need not be outcome-equivalent; it does not estimate human
    cognitive parameters or generated-dialogue parameter robustness.
