# GPT-4o-mini version of the fair two-agent comparison.
#
# Run with:
#   python validation/scripts/run_two_agent_model_comparison.py \
#     --comparison-spec validation/config/two_agent_model_comparison_gpt4omini.yaml \
#     --topics journalism \
#     --rounds 15 --trials 3 \
#     --be-update-sensitivity 0.2 \
#     --be-anchor-sensitivity 0.4 \
#     --output-dir validation/results/journalism_fair_baselines_gpt4omini_u02_a04

conditions:
  - name: be_gpt4omini
    label: Belief Engine (4o-mini)
    agent_type: belief_engine
    backend: openai
    model: gpt-4o-mini

  - name: vanilla_no_update_gpt4omini
    label: Vanilla no-update (4o-mini)
    agent_type: vanilla
    backend: openai
    model: gpt-4o-mini

  - name: prompt_self_update_gpt4omini
    label: Prompt self-update (4o-mini)
    agent_type: prompt_self_update
    backend: openai
    model: gpt-4o-mini

  - name: rag_only_gpt4omini
    label: RAG-only (4o-mini)
    agent_type: rag
    backend: openai
    model: gpt-4o-mini

  - name: rag_self_update_gpt4omini
    label: RAG + self-update (4o-mini)
    agent_type: rag_self_update
    backend: openai
    model: gpt-4o-mini
