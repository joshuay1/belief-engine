[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "belief-engine"
version = "1.0.0"
description = "Auditable stance updates for LLM deliberation"
requires-python = ">=3.11"
license = {file = "LICENSE"}

# Core dependencies — enough to run episodic/summary/conceptual/worldview experiments
dependencies = [
    "pyyaml>=6.0",
    "openai>=2.0",
    "requests>=2.30",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "tabulate>=0.9",
    "tiktoken>=0.6",
]

[project.optional-dependencies]
classifier = [
    "torch>=2.10,<2.11",
    "transformers==5.1.0",
    "huggingface-hub==1.4.1",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
]
embeddings = ["sentence-transformers>=5.0"]
# Agentic memory mode (requires ChromaDB + sentence-transformers + torch)
agentic = [
    "sentence-transformers>=5.0",
    "torch>=2.0",
    "transformers>=5.0",
    "chromadb>=1.0",
]
# Analysis & plotting tools
analysis = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
]
# Full install (everything)
full = [
    "belief-engine[classifier]",
    "belief-engine[agentic]",
    "belief-engine[analysis]",
]

[project.scripts]
agentmem = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*", "validation*"]

[tool.setuptools.package-data]
"src.simulation" = ["belief_instructions.json"]
"src.prompts" = ["*.txt"]
